<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        #instruction {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 1000;
            font-family: sans-serif;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="instruction">Tap on the map to select a stop location</div>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([41.9981, 21.4254], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var marker = null;

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }

            // Reverse geocode via Nominatim
            fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json')
                .then(r => r.json())
                .then(data => {
                    var address = data.display_name || (lat.toFixed(5) + ', ' + lng.toFixed(5));
                    marker.bindPopup(address).openPopup();
                    window.location.href = 'stoppicker://picked?lat=' + lat + '&lng=' + lng + '&address=' + encodeURIComponent(address);
                })
                .catch(() => {
                    var address = lat.toFixed(5) + ', ' + lng.toFixed(5);
                    window.location.href = 'stoppicker://picked?lat=' + lat + '&lng=' + lng + '&address=' + encodeURIComponent(address);
                });
        });
    </script>
</body>
</html>
