<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        :root {
            --primary: #0B6EF3;
            --primary-dark: #084EB0;
            --success: #12B981;
            --warning: #F97316;
            --muted: #667085;
            --surface: rgba(255, 255, 255, 0.92);
            --border: rgba(16, 24, 40, 0.10);
        }

        .ft-legend {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            box-shadow: 0 10px 28px rgba(16, 24, 40, 0.15);
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }
        .ft-legend .title { font-size: 11px; font-weight: 700; margin: 0 0 6px 0; color: #101828; }
        .ft-legend .row { display:flex; align-items:center; gap:8px; font-size: 11px; margin: 4px 0; color:#344054; }
        .ft-swatch { width: 10px; height: 10px; border-radius: 999px; box-shadow: 0 0 0 2px #fff; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([41.9981, 21.4254], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var vehicleMarker = null;
        var stopMarkers = {};
        var routeLine = null;
        var routePoints = [];

        // Legend
        var legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'ft-legend');
            div.innerHTML =
                '<div class="title">Trip</div>' +
                '<div class="row"><span class="ft-swatch" style="background:var(--primary)"></span><span>Vehicle</span></div>' +
                '<div class="row"><span class="ft-swatch" style="background:var(--muted)"></span><span>Stop (Pending)</span></div>' +
                '<div class="row"><span class="ft-swatch" style="background:var(--warning)"></span><span>Stop (Active)</span></div>' +
                '<div class="row"><span class="ft-swatch" style="background:var(--success)"></span><span>Stop (Completed)</span></div>';
            return div;
        };
        legend.addTo(map);

        // Vehicle icon — primary dot
        var vehicleIcon = L.divIcon({
            className: '',
            html: '<div style="background:var(--primary);width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 10px 22px rgba(16,24,40,0.25)"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        function stopIcon(status) {
            var color = status === 'Completed' ? 'var(--success)'
                : status === 'Active' ? 'var(--warning)'
                    : 'var(--muted)';
            return L.divIcon({
                className: '',
                html: '<div style="background:' + color + ';width:12px;height:12px;border-radius:50%;border:2px solid white;box-shadow:0 10px 18px rgba(16,24,40,0.18)"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
        }

        // Called from C# to add or update a stop marker
        function addStop(stopId, lat, lng, name, status) {
            if (stopMarkers[stopId]) {
                stopMarkers[stopId].setIcon(stopIcon(status));
                stopMarkers[stopId].setTooltipContent(name + '<br>' + status);
            } else {
                var marker = L.marker([lat, lng], { icon: stopIcon(status) })
                    .bindTooltip(name + '<br>' + status, { permanent: true, direction: 'top', offset: [0, -10] })
                    .addTo(map);
                stopMarkers[stopId] = marker;
            }
            updateRouteLine();
        }

        // Called from C# on every location update
        function updateVehicle(lat, lng) {
            if (vehicleMarker) {
                vehicleMarker.setLatLng([lat, lng]);
            } else {
                vehicleMarker = L.marker([lat, lng], { icon: vehicleIcon })
                    .bindTooltip('Vehicle', { permanent: false })
                    .addTo(map);
            }
            routePoints.push([lat, lng]);
            updateRouteLine();
            map.panTo([lat, lng]);
        }

        // Update stop marker status (called on StopApproaching / StopCompleted)
        function updateStopStatus(stopId, status) {
            if (stopMarkers[stopId]) {
                stopMarkers[stopId].setIcon(stopIcon(status));
                var tooltip = stopMarkers[stopId].getTooltip();
                if (tooltip) {
                    var parts = tooltip.getContent().split('<br>');
                    stopMarkers[stopId].setTooltipContent(parts[0] + '<br>' + status);
                }
            }
        }

        // Draws a polyline from vehicle start through all stops
        function updateRouteLine() {
            var points = routePoints.concat(
                Object.values(stopMarkers).map(m => [m.getLatLng().lat, m.getLatLng().lng])
            );
            if (routeLine) {
                routeLine.setLatLngs(routePoints);
            } else if (routePoints.length > 1) {
                routeLine = L.polyline(routePoints, { color: 'var(--primary)', weight: 4, opacity: 0.8 }).addTo(map);
            }
        }

        // Fit map to show all stops
        function fitToStops() {
            var allMarkers = Object.values(stopMarkers);
            if (vehicleMarker) allMarkers.push(vehicleMarker);
            if (allMarkers.length === 0) return;
            var group = L.featureGroup(allMarkers);
            map.fitBounds(group.getBounds().pad(0.2));
        }
    </script>
</body>
</html>
